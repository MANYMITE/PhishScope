[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishscope"
version = "1.0.1"
description = "Offline, explainable phishing-URL risk engine — pure Python, zero dependencies"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "MANYMITE" }]
keywords = [
    "phishing", "cybersecurity", "security", "url-scanner",
    "homoglyph", "typosquatting", "fraud-detection", "osint",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]

[project.scripts]
phishscope = "phishscope.cli:main"

[tool.setuptools]
packages = ["phishscope"]
